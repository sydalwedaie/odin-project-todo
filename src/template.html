<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The solusion to The Odin Project's Todo List challenge"
    />
    <meta name="og:image" content="og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon-16x16.png"
    />
    <link rel="manifest" href="./site.webmanifest" />

    <title>myThings</title>
  </head>
  <body>
    <div class="app-shell">
      <nav class="sidebar"></nav>
      <main class="main">
        <div id="content"></div>

        <!-- Add/Edit todo dialog -->
        <dialog closedby="any" class="todo-dialog"></dialog>

        <!-- Settings dialog -->
        <dialog closedby="any" class="settings-dialog"></dialog>
      </main>
    </div>
  </body>
</html>
